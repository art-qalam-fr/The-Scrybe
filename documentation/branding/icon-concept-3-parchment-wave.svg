<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <linearGradient id="emerald_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="gold_accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="p_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg3)"/>
  <rect width="1016" height="1016" x="4" y="4" rx="220" stroke="url(#emerald_grad)" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Scribe's Ancient Parchment Geometry (Modern Minimalist Frame) -->
  <rect x="220" y="200" width="584" height="624" rx="36" fill="#18181b" stroke="#27272a" stroke-width="4"/>
  <rect x="250" y="230" width="524" height="564" rx="24" stroke="url(#emerald_grad)" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Wax Seal / Microphone Emblem at Top Center -->
  <circle cx="512" cy="200" r="46" fill="#18181b" stroke="url(#gold_accent)" stroke-width="6"/>
  <circle cx="512" cy="200" r="30" fill="url(#gold_accent)" opacity="0.2"/>
  <circle cx="512" cy="200" r="16" fill="url(#gold_accent)"/>

  <!-- Soundwave Transforming into Cursive Manuscript Lines -->
  <g filter="url(#p_glow)">
    <!-- Line 1: High amplitude voice input -->
    <path d="M290 360 Q 340 310, 390 360 T 490 360 T 590 360 T 690 360 L 730 360" 
          stroke="url(#emerald_grad)" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Line 2: Intense modulation wave (recognition peak) -->
    <path d="M290 470 Q 330 390, 370 470 T 450 470 T 530 470 T 610 470 T 690 470 L 730 470" 
          stroke="url(#emerald_grad)" stroke-width="16" stroke-linecap="round" fill="none"/>

    <!-- Line 3: Smoothed recognized text signal -->
    <path d="M290 580 Q 360 540, 430 580 T 570 580 T 710 580 L 730 580" 
          stroke="url(#emerald_grad)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Line 4: Final written script ending in a quill tip -->
    <path d="M290 690 L 610 690" stroke="url(#emerald_grad)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <circle cx="630" cy="690" r="8" fill="url(#gold_accent)"/>
    <polygon points="650,690 680,678 674,690 680,702" fill="url(#gold_accent)"/>
  </g>
</svg>