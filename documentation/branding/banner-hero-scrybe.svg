<svg width="1280" height="380" viewBox="0 0 1280 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="banner_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Calame Gold Gradient -->
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Neural Voice Gradient -->
    <linearGradient id="voice_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>

    <filter id="glow_banner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Banner Background Tile -->
  <rect width="1280" height="380" rx="16" fill="url(#banner_bg)"/>
  <rect width="1280" height="380" rx="16" fill="url(#grid)"/>
  <rect width="1278" height="378" x="1" y="1" rx="15" stroke="url(#voice_grad)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Ambient Light Orbs -->
  <circle cx="220" cy="190" r="140" fill="#4338ca" opacity="0.2" filter="url(#glow_banner)"/>
  <circle cx="1060" cy="280" r="180" fill="#0284c7" opacity="0.12" filter="url(#glow_banner)"/>

  <!-- Left Icon Graphic: The Calame & Acoustic Field -->
  <g transform="translate(40, -10)">
    <!-- Acoustic Halo Rings -->
    <circle cx="180" cy="200" r="120" stroke="url(#voice_grad)" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="10 8"/>
    <circle cx="180" cy="200" r="95" stroke="url(#voice_grad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="16 12"/>

    <!-- Calame Nib Emblem -->
    <g filter="url(#glow_banner)">
      <path d="M180 90 L220 190 C228 210 220 235 200 250 L180 268 L160 250 C140 235 132 210 140 190 Z" 
            fill="url(#gold_grad)"/>
      <path d="M180 90 L220 190 C228 210 220 235 200 250 L180 268 Z" 
            fill="#000" fill-opacity="0.2"/>
      <circle cx="180" cy="195" r="12" fill="#070a12" stroke="url(#gold_grad)" stroke-width="3"/>
      <line x1="180" y1="90" x2="180" y2="183" stroke="#070a12" stroke-width="4" stroke-linecap="round"/>
      <path d="M180 268 L188 305 C188 310 184 314 180 314 C176 314 172 310 172 305 Z" fill="url(#gold_grad)"/>
    </g>

    <!-- Wave lines bridging icon to text -->
    <path d="M180 314 C180 340 140 340 140 355 C140 365 155 370 180 370 C220 370 250 350 280 350 L340 350" 
          stroke="url(#voice_grad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Typography / Brand Header -->
  <g transform="translate(380, 50)">
    <!-- Top Organization Surtitle -->
    <text x="2" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" font-weight="700" letter-spacing="4" fill="#a855f7">
      ORGANISATION ART-QALAM
    </text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cinzel', serif" 
          font-size="64" font-weight="900" letter-spacing="4" fill="#ffffff">
      THE SCRYBE
    </text>

    <!-- Subtle Gold Accent Dot -->
    <circle cx="445" cy="56" r="6" fill="url(#gold_grad)"/>

    <!-- Subtitle / Mission Statement -->
    <text x="2" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="20" font-weight="500" letter-spacing="1.5" fill="#94a3b8">
      L'Art du Verbe Transcrit par l'Intelligence Locale
    </text>
    <text x="2" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14" font-weight="400" letter-spacing="0.5" fill="#64748b">
      Sovereign Desktop Voice-to-Text Engine · 100% Offline AI · Native Win32 Injection
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 190)">
      <!-- Badge 1: 100% Offline -->
      <rect x="0" y="0" width="138" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#10b981"/>
      <text x="28" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">100% Hors-Ligne</text>

      <!-- Badge 2: Whisper AI -->
      <rect x="150" y="0" width="168" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="166" cy="16" r="4" fill="#6366f1"/>
      <text x="178" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Whisper &amp; CTranslate2</text>

      <!-- Badge 3: Zero Cloud -->
      <rect x="330" y="0" width="135" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="346" cy="16" r="4" fill="#f59e0b"/>
      <text x="358" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Zéro Cloud</text>

      <!-- Badge 4: Win32 Push-to-Talk -->
      <rect x="477" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="493" cy="16" r="4" fill="#38bdf8"/>
      <text x="505" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Push-to-Talk Global</text>

      <!-- Badge 5: Art-qalam -->
      <rect x="649" y="0" width="155" height="32" rx="16" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="667" cy="16" r="5" fill="#f43f5e"/>
      <text x="682" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">Art-qalam</text>
    </g>
  </g>

  <!-- Bottom Dynamic Wave Transforming into Written Cursive Track -->
  <g opacity="0.6">
    <path d="M 0 350 Q 80 320, 160 350 T 320 350 T 480 350 Q 560 320, 640 350 T 800 350 T 960 350 Q 1040 370, 1120 350 T 1280 350" 
          stroke="url(#voice_grad)" stroke-width="2.5" fill="none"/>
    <path d="M 0 358 Q 120 340, 240 358 T 480 358 T 720 358 Q 840 375, 960 358 T 1200 358 L 1280 358" 
          stroke="url(#voice_grad)" stroke-width="1" stroke-opacity="0.4" fill="none"/>
  </g>
</svg>