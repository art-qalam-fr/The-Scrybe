<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Electric Cyan to Purple Gradient -->
    <linearGradient id="s_ribbon_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="s_ribbon_2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <filter id="soft_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg2)"/>
  <rect width="1016" height="1016" x="4" y="4" rx="220" stroke="#374151" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Dynamic Equalizer Halo behind S -->
  <g opacity="0.15" stroke="url(#s_ribbon_1)" stroke-width="8" stroke-linecap="round">
    <circle cx="512" cy="512" r="340" stroke-dasharray="12 28"/>
    <circle cx="512" cy="512" r="280" stroke-dasharray="6 20"/>
  </g>

  <!-- Scribe Monogram S made of Acoustic Calligraphy -->
  <g filter="url(#soft_glow)">
    <!-- Upper loop of the S forming sound frequencies -->
    <path d="M680 280 C680 200 580 180 500 180 C360 180 320 280 320 370 C320 500 460 520 540 560 C640 610 680 670 680 760 C680 870 560 900 480 900 C360 900 300 830 300 760" 
          stroke="url(#s_ribbon_1)" stroke-width="68" stroke-linecap="round" fill="none"/>

    <!-- Inner Parallel Fine Sound Line -->
    <path d="M630 300 C630 240 560 220 500 220 C400 220 370 280 370 340 C370 430 460 460 540 500 C620 540 730 600 730 730 C730 820 640 860 560 860" 
          stroke="url(#s_ribbon_2)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Quill Sparkle at the apex (the Scribe's touch) -->
    <circle cx="680" cy="280" r="16" fill="#38bdf8"/>
    <polygon points="300,760 330,730 320,780" fill="#ec4899"/>

    <!-- Microphone Capsule core hidden inside the heart of S -->
    <rect x="492" y="440" width="40" height="70" rx="20" fill="url(#s_ribbon_1)"/>
    <line x1="512" y1="520" x2="512" y2="550" stroke="url(#s_ribbon_1)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>