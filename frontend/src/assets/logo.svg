<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>

    <!-- Calame Gold / Amber Gradient -->
    <linearGradient id="nib_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Audio Frequency Violet / Cyan Gradient -->
    <linearGradient id="wave_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Deep Shield Gradient -->
    <linearGradient id="shield_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="neon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Container (Rounded App Tile) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg_glow)"/>
  <rect width="1020" height="1020" x="2" y="2" rx="222" stroke="url(#wave_grad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Concentric Sound Circles (Acoustic Field) -->
  <circle cx="512" cy="512" r="380" stroke="url(#wave_grad)" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="16 12"/>
  <circle cx="512" cy="512" r="310" stroke="url(#wave_grad)" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="24 16"/>

  <!-- Soundwave Bars (Writing rhythm / Scribe speech waves) -->
  <g opacity="0.85">
    <line x1="232" y1="512" x2="232" y2="512" stroke="url(#wave_grad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="272" y1="462" x2="272" y2="562" stroke="url(#wave_grad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="312" y1="422" x2="312" y2="602" stroke="url(#wave_grad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="352" y1="472" x2="352" y2="552" stroke="url(#wave_grad)" stroke-width="12" stroke-linecap="round"/>

    <line x1="672" y1="472" x2="672" y2="552" stroke="url(#wave_grad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="712" y1="422" x2="712" y2="602" stroke="url(#wave_grad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="752" y1="462" x2="752" y2="562" stroke="url(#wave_grad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="792" y1="512" x2="792" y2="512" stroke="url(#wave_grad)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- The Scribe Feather / Calame Nib Body (Centerpiece) -->
  <g filter="url(#neon_glow)">
    <!-- Nib Wings -->
    <path d="M512 180 L620 440 C640 490 620 560 570 600 L512 650 L454 600 C404 560 384 490 404 440 Z" 
          fill="url(#nib_gold)" />

    <!-- Inner Shadow Facet for 3D Chiseled Look -->
    <path d="M512 180 L620 440 C640 490 620 560 570 600 L512 650 Z" 
          fill="#000" fill-opacity="0.18"/>

    <!-- Calame Vent Hole (Microphone Eye) -->
    <circle cx="512" cy="460" r="32" fill="#090d16" stroke="url(#nib_gold)" stroke-width="6"/>

    <!-- Calame Slit (Central Channel down to the tip) -->
    <line x1="512" y1="180" x2="512" y2="428" stroke="#090d16" stroke-width="10" stroke-linecap="round"/>

    <!-- Nib Tip Extension to Ground / Wave Contact -->
    <path d="M512 650 L532 760 C532 770 524 780 512 780 C500 780 492 770 492 760 Z" 
          fill="url(#nib_gold)"/>

    <!-- Flowing Written Audio Wave emerging from the Nib Tip -->
    <path d="M512 780 C512 840 430 840 430 890 C430 920 460 940 512 940 C580 940 630 910 630 860" 
          stroke="url(#wave_grad)" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>
</svg>